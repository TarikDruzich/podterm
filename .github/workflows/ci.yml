name: Rust CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Show Rust version
        run: rustc --version && cargo --version
      - name: Run tests
        run: cargo test --all-targets
      - name: Build release binary
        run: cargo build --release
