[package]
name = "podterm-rs"
version = "0.4.4"
edition = "2021"
authors = ["podterm contributors"]
description = "A minimal terminal podcast player powered by mpv"
license = "MIT"

[[bin]]
name = "podterm-rs"
path = "src/main.rs"

[dependencies]
crossterm = "0.29"
quick-xml = "0.38"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2"
unicode-width = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = "z"
strip = true
panic = "abort"
